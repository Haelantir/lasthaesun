# Warms the ISR cache once a production deployment is actually live.
#
# `deployment_status` is the event Vercel's GitHub integration posts when it
# finishes deploying, so this needs no polling, no sleep and no VERCEL_TOKEN —
# it simply cannot run against a deployment that is not up yet, which is the one
# way a warm run can silently do nothing.
#
# Why warm at all: `generateStaticParams()` returns `[]` on both dynamic routes,
# so a page is first rendered when someone asks for it. On a site with no
# traffic yet that someone is Googlebot, and it pays 670-940ms instead of the
# 40-95ms a warm page answers in. Google throttles crawl rate against what it
# measures, so the crawler was being taught to crawl less.
#
# The job fails if any URL answers something other than 200, which makes it a
# link check over the sitemap plus every hub as well.
name: warm

on:
  deployment_status:
  # So it can also be run by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# A newer deployment makes an in-flight warm pointless — the cache it is filling
# belongs to the build being replaced.
concurrency:
  group: warm
  cancel-in-progress: true

jobs:
  warm:
    # Production only. Preview deployments get no crawler traffic, so warming
    # them would spend minutes filling a cache nothing reads.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      WARM_ORIGIN: https://caniignoreit.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the machine the lockfile was generated on, so npm resolves
          # the same tree. Node 22 ships npm 10, which hoists tsx's nested
          # esbuild differently and made the first run fail with
          # "Missing: esbuild@0.28.2 from lock file".
          node-version: 24
          cache: npm

      # `npm install`, not `npm ci`. This job needs one dev dependency (tsx) in
      # order to curl a few hundred urls; it has no reproducibility requirement
      # worth failing a deploy-time warm over, and `install` tolerates the same
      # lockfile drift the Vercel build already tolerates. If the lockfile is
      # ever regenerated so that `npm ci` passes on Linux, switch back.
      - run: npm install --no-audit --no-fund

      - name: Warm every crawlable url
        run: npm run warm
